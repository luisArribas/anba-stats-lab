name: Daily ANBA + NBA Stats Sync (08:00 Madrid)

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (08:00 AM en Madrid CET)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite también lanzarlo manualmente con 1 clic desde GitHub

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch live ANBA (2026-27 & 2025-26) + NBA stats
        run: python scripts/generate_dataset.py

      - name: Commit & Push updated dataset (triggers automatic Vercel redeploy)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "ANBA Stats Daily Bot"
          git add src/data/anba_nba_data.json
          git diff --staged --quiet || (git commit -m "chore(data): daily sync ANBA + NBA stats ($(date +'%Y-%m-%d %H:%M %Z'))" && git push)
